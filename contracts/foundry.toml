[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"          # Monad EIP-7702 destekliyor (Prague seviyesi); invalid opcode görülürse "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false                  # "stack too deep" çıkarsa true yapılır
bytecode_hash = "none"          # deterministik bytecode, kaynak doğrulama kolaylığı
cbor_metadata = true
use_literal_content = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./broadcast" }
]
ffi = false

[profile.default.fuzz]
runs = 2000
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 512, depth = 100 }

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
anvil = "http://127.0.0.1:8545"

[fmt]
line_length = 120
tab_width = 4
